workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 120
    environment:
      node: 20.x
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo Prebuild (Generate Native Android Code)
        script: npx expo prebuild --platform android --clean
      - name: Build Android Release APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/**/*.apk
    publishing:
      email:
        recipients:
          - trabattig7@gmail.com # Update this in Codemagic UI or here
        notify:
          success: true
          failure: true
